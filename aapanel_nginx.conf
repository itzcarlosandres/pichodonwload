# ==============================================================================
# Configuración Nginx Optimizada para Laravel en aaPanel
# Pegar dentro de: aaPanel > Website > [Tu Sitio] > Config
# ==============================================================================

server
{
    listen 80;
    listen 443 ssl http2;
    server_name tudominio.com www.tudominio.com;
    index index.php index.html;
    root /www/wwwroot/tudominio.com/public;

    # SSL (Configurado automáticamente por Let's Encrypt de aaPanel)
    # ssl_certificate ...;
    # ssl_certificate_key ...;

    # Tamaño máximo de subida (ROMs grandes e imágenes)
    client_max_body_size 500M;
    client_header_timeout 300s;
    client_body_timeout 300s;

    # Compresión Gzip para máxima velocidad y SEO
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # Enrutamiento estándar de Laravel (URL Rewrite)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesamiento PHP-FPM con buffers optimizados
    location ~ [^/]\.php(/|$) {
        try_files $uri =404;
        fastcgi_pass unix:/tmp/php-cgi-82.sock; # Ajustar a tu versión de PHP en aaPanel (ej: php-cgi-82.sock o php-cgi-83.sock)
        fastcgi_index index.php;
        include fastcgi.conf;

        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_connect_timeout 60s;
    }

    # Caché agresiva para assets compilados por Vite (CSS, JS, Fuentes, WebP)
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # Sitemaps y robots sin caché para entrega en tiempo real
    location ~* (sitemap.*\.xml|robots\.txt)$ {
        try_files $uri /index.php?$query_string;
        expires 1h;
        access_log off;
    }

    # Bloquear acceso a archivos sensibles y ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    access_log /www/wwwlogs/tudominio.com.log;
    error_log /www/wwwlogs/tudominio.com.error.log;
}
