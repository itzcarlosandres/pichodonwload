# ==============================================================================
# Configuración de VirtualHost para Apache en aaPanel
# Proyecto: PICHO Roms / ROMHUB
# ==============================================================================
# Esta configuración se aplica en aaPanel en:
# Website -> Tu Dominio -> Config (o Apache Vhost)

<VirtualHost *:80>
    ServerAdmin webmaster@tudominio.com
    # Reemplaza tudominio.com por tu dominio real
    DocumentRoot "/www/wwwroot/tudominio.com/public"
    ServerName tudominio.com
    ServerAlias www.tudominio.com
    
    # Logs
    ErrorLog "/www/wwwlogs/tudominio.com-error_log"
    CustomLog "/www/wwwlogs/tudominio.com-access_log" combined

    # Configuración del Directorio Public de Laravel
    <Directory "/www/wwwroot/tudominio.com/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Evitar accesos indebidos a directorios sensibles si están en la raíz
    <Directory "/www/wwwroot/tudominio.com">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Denegar acceso directo a archivos críticos
    <FilesMatch "^\.(env|git|env\.example|editorconfig)">
        Require all denied
    </FilesMatch>

    # Configuración de tiempo de espera y subida para PHP-FPM
    # Evita el error 504 Gateway Timeout al subir ROMs pesadas o generar contenido con IA
    <IfModule proxy_module>
        ProxyTimeout 300
    </IfModule>
    TimeOut 300

    # Permitir subida de archivos pesados (ROMs de 500MB+) sin que Apache los bloquee
    LimitRequestBody 524288000
</VirtualHost>
