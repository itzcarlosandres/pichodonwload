<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 820" width="600" height="820">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="50%" stop-color="#090d13"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="820" fill="url(#bgGrad)"/>
  <rect width="600" height="820" fill="url(#grid)"/>
  <rect width="600" height="820" fill="url(#centerGlow)"/>

  <!-- Cartridge Outer Border -->
  <rect x="25" y="25" width="550" height="770" rx="20" fill="none" stroke="#232936" stroke-width="2"/>
  <rect x="40" y="40" width="520" height="740" rx="14" fill="#0d1117" fill-opacity="0.5" stroke="#1f293d" stroke-width="1"/>

  <!-- Top Accent Bar -->
  <path d="M 40 54 Q 40 40 54 40 L 546 40 Q 560 40 560 54 L 560 56 L 40 56 Z" fill="url(#neonGlow)"/>

  <!-- Controller Icon in Center -->
  <g transform="translate(180, 270)">
    <!-- Controller Body -->
    <path d="M 40 60 C 20 60 0 80 0 110 C 0 150 25 180 60 180 C 80 180 95 165 110 150 L 130 150 C 145 165 160 180 180 180 C 215 180 240 150 240 110 C 240 80 220 60 200 60 L 40 60 Z" fill="#131924" stroke="#2a3447" stroke-width="3"/>
    
    <!-- D-Pad -->
    <path d="M 60 90 L 70 90 L 70 100 L 80 100 L 80 110 L 70 110 L 70 120 L 60 120 L 60 110 L 50 110 L 50 100 L 60 100 Z" fill="#38bdf8" opacity="0.8"/>
    
    <!-- Action Buttons -->
    <circle cx="170" cy="98" r="6" fill="#f43f5e" opacity="0.85"/>
    <circle cx="185" cy="113" r="6" fill="#10b981" opacity="0.85"/>
    <circle cx="155" cy="113" r="6" fill="#3b82f6" opacity="0.85"/>
    <circle cx="170" cy="128" r="6" fill="#f59e0b" opacity="0.85"/>

    <!-- Center LED / Screen -->
    <rect x="105" y="102" width="30" height="12" rx="4" fill="#06b6d4" opacity="0.5"/>
  </g>

  <!-- Typography -->
  <text x="300" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="4">RETRO ROM</text>
  <text x="300" y="555" font-family="monospace" font-size="13" font-weight="500" fill="#475569" text-anchor="middle" letter-spacing="2">CARÁTULA NO DISPONIBLE</text>

  <!-- Bottom Details -->
  <line x1="200" y1="620" x2="400" y2="620" stroke="#232936" stroke-width="1"/>
  <circle cx="300" cy="620" r="4" fill="#3b82f6" opacity="0.6"/>
  <text x="300" y="660" font-family="monospace" font-size="11" fill="#334155" text-anchor="middle" letter-spacing="3">AUTHENTIC VAULT</text>
</svg>
